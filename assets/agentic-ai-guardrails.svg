  <!-- Title -->
  <text class="head" x="80" y="190" font-size="42" font-weight="700" fill="#4B4B4B">Harnessing <tspan fill="url(#gradTitle)">Agentic AI</tspan> for Difficult Tasks</text>

  <!-- Challenge band -->
  <rect x="80" y="224" width="1440" height="58" rx="10" fill="#FDF2F8" stroke="#F5CFE6"/>
  <text class="head" x="108" y="259" font-size="12.5" font-weight="700" letter-spacing="2" fill="#E90575">THE CHALLENGE</text>
  <text class="body" x="290" y="259" font-size="15.5" fill="#4B4B4B">Learning a new domain as a new hire without being misled by AI hallucinations.</text>

  <!-- Card 1 Skills -->
  <rect x="80" y="316" width="268" height="228" rx="10" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
  <rect x="80" y="316" width="268" height="6" rx="3" fill="#FF007F"/>
  <g transform="translate(102,344)" stroke="#FF007F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22,8 C16,3 6,3 2,6 L2,32 C6,29 16,29 22,34"/>
    <path d="M22,8 C28,3 38,3 42,6 L42,32 C38,29 28,29 22,34"/>
    <line x1="22" y1="8" x2="22" y2="34"/>
  </g>
  <text class="head" x="102" y="420" font-size="17" font-weight="700" fill="#4B4B4B">Skills</text>
  <text class="body" x="102" y="450" font-size="13" fill="#828282">Playbooks the AI follows like a</text>
  <text class="body" x="102" y="469" font-size="13" fill="#828282">guidebook. Keeps every answer</text>
  <text class="body" x="102" y="488" font-size="13" fill="#828282">grounded.</text>

  <!-- Card 2 Prompt engineering -->
  <rect x="373" y="316" width="268" height="228" rx="10" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
  <rect x="373" y="316" width="268" height="6" rx="3" fill="#E90575"/>
  <g transform="translate(395,344)" stroke="#E90575" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="5" width="40" height="32" rx="5"/>
    <polyline points="10,15 17,21 10,27"/>
    <line x1="22" y1="28" x2="32" y2="28"/>
  </g>
  <text class="head" x="395" y="420" font-size="17" font-weight="700" fill="#4B4B4B">Prompt engineering</text>
  <text class="body" x="395" y="450" font-size="13" fill="#828282">Structured asks. For example:</text>
  <rect x="395" y="464" width="216" height="26" rx="13" fill="#FDEFF6" stroke="#E90575" stroke-width="1"/>
  <text class="mono" x="407" y="481" font-size="10.5" fill="#4B4B4B">"Cite a source for every claim."</text>
  <rect x="395" y="498" width="216" height="26" rx="13" fill="#FDEFF6" stroke="#E90575" stroke-width="1"/>
  <text class="mono" x="407" y="515" font-size="10.5" fill="#4B4B4B">"If unsure, answer 'unknown'."</text>

  <!-- Card 3 Rules -->
  <rect x="666" y="316" width="268" height="228" rx="10" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
  <rect x="666" y="316" width="268" height="6" rx="3" fill="#C0059E"/>
  <g transform="translate(688,344)" stroke="#C0059E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21,2 L37,8 V19 C37,29 30,36 21,40 C12,36 5,29 5,19 V8 Z"/>
    <polyline points="13,20 19,26 29,14"/>
  </g>
  <text class="head" x="688" y="420" font-size="17" font-weight="700" fill="#4B4B4B">Rules</text>
  <text class="body" x="688" y="450" font-size="13" fill="#828282">Boundaries the AI always obeys:</text>
  <text class="body" x="688" y="469" font-size="13" fill="#828282">never invent facts, verify</text>
  <text class="body" x="688" y="488" font-size="13" fill="#828282">before asserting.</text>

  <!-- Card 4 Relevant context -->
  <rect x="959" y="316" width="268" height="228" rx="10" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
  <rect x="959" y="316" width="268" height="6" rx="3" fill="#9F02AB"/>
  <g transform="translate(981,344)" stroke="#9F02AB" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="21" cy="21" r="17"/>
    <circle cx="21" cy="21" r="9"/>
    <circle cx="21" cy="21" r="2.5" fill="#9F02AB" stroke="none"/>
  </g>
  <text class="head" x="981" y="420" font-size="17" font-weight="700" fill="#4B4B4B">Relevant context</text>
  <text class="body" x="981" y="450" font-size="13" fill="#828282">Only the right files and facts</text>
  <text class="body" x="981" y="469" font-size="13" fill="#828282">go in. Answers come from real</text>
  <text class="body" x="981" y="488" font-size="13" fill="#828282">sources, not guesses.</text>

  <!-- Card 5 Documentation -->
  <rect x="1252" y="316" width="268" height="228" rx="10" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
  <rect x="1252" y="316" width="268" height="6" rx="3" fill="#7E00B9"/>
  <g transform="translate(1274,344)" stroke="#7E00B9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="2" width="26" height="32" rx="3"/>
    <rect x="2" y="9" width="26" height="32" rx="3" fill="#FFFFFF"/>
    <line x1="9" y1="20" x2="21" y2="20"/>
    <line x1="9" y1="27" x2="21" y2="27"/>
    <line x1="9" y1="34" x2="16" y2="34"/>
  </g>
  <text class="head" x="1274" y="420" font-size="17" font-weight="700" fill="#4B4B4B">Documentation</text>
  <text class="body" x="1274" y="450" font-size="13" fill="#828282">Verified results are saved and</text>
  <text class="body" x="1274" y="469" font-size="13" fill="#828282">reused. Every task grounds</text>
  <text class="body" x="1274" y="488" font-size="13" fill="#828282">the next one.</text>

  <!-- Takeaway -->
  <rect x="80" y="608" width="1440" height="70" rx="12" fill="url(#gradBar)"/>
  <text class="head" x="800" y="651" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Grounded AI: difficult tasks get faster and every answer stays trustworthy.</text>

  <text class="body" x="800" y="760" font-size="12" letter-spacing="3" fill="#B2B2B2" text-anchor="middle">AGENTIC AI &#183; WORKING PRACTICES</text>
</svg>
