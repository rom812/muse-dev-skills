<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1520" viewBox="0 0 1200 1520" role="img" aria-label="Infographic: Agentic AI without the hallucinations — prompt engineering, skills, and documentation as guardrails for frustrating engineering tasks">
  <style>
    .display { font-family: "Avenir Next", Avenir, Futura, "Segoe UI", sans-serif; }
    .body    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono    { font-family: "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- ground -->
  <rect width="1200" height="1520" fill="#EDF1F7"/>

  <!-- ================= HEADER ================= -->
  <text class="mono" x="60" y="78" font-size="13" letter-spacing="2" fill="#1E44B8">MUSE TEAM · WORKING WITH AGENTIC AI</text>
  <text class="display" x="60" y="132" font-size="46" font-weight="700" fill="#16223A">Agentic AI, <tspan fill="#1E44B8">without</tspan> the hallucinations</text>
  <text class="body" x="60" y="170" font-size="17" fill="#4B5A75">How I use prompt engineering, reusable skills, and living documentation to point AI at the most</text>
  <text class="body" x="60" y="194" font-size="17" fill="#4B5A75">frustrating engineering tasks — and actually trust the answers.</text>

  <!-- ================= THE FRUSTRATING TASK ================= -->
  <text class="mono" x="60" y="248" font-size="12" letter-spacing="2.5" fill="#4B5A75">THE FRUSTRATING TASK</text>
  <line x1="270" y1="244" x2="1140" y2="244" stroke="#C9D3E2" stroke-width="1"/>

  <text class="display" x="60" y="292" font-size="24" font-weight="600" fill="#16223A">Tracing undocumented code flows</text>
  <rect x="628" y="268" width="512" height="34" rx="6" fill="#FFFFFF" stroke="#C9D3E2"/>
  <text class="mono" x="644" y="290" font-size="12.5" fill="#16223A">"What actually happens when a topology notification arrives?"</text>

  <text class="body" x="60" y="320" font-size="14.5" fill="#4B5A75">The answer jumps across services, async events, and databases — and none of it is written down.</text>
  <text class="body" x="60" y="340" font-size="14.5" fill="#4B5A75">Hours disappear into reverse-engineering, and one wrong assumption can derail a demo.</text>

  <!-- trace diagram -->
  <rect x="60" y="364" width="1080" height="84" rx="8" fill="#FFFFFF" stroke="#C9D3E2"/>
  <!-- node: notification -->
  <rect x="100" y="391" width="114" height="30" rx="6" fill="#EDF1F7" stroke="#C9D3E2"/>
  <text class="mono" x="157" y="411" font-size="12.5" fill="#16223A" text-anchor="middle">notification</text>
  <line x1="214" y1="406" x2="336" y2="406" stroke="#4B5A75" stroke-width="2" stroke-dasharray="6 6" opacity="0.75"/>
  <!-- node: ? service -->
  <rect x="336" y="391" width="92" height="30" rx="6" fill="#F6EDE1" stroke="#B26A05" stroke-dasharray="5 4"/>
  <text class="mono" x="382" y="411" font-size="12.5" fill="#B26A05" text-anchor="middle">? service</text>
  <line x1="428" y1="406" x2="550" y2="406" stroke="#4B5A75" stroke-width="2" stroke-dasharray="6 6" opacity="0.75"/>
  <!-- node: ? listener -->
  <rect x="550" y="391" width="99" height="30" rx="6" fill="#F6EDE1" stroke="#B26A05" stroke-dasharray="5 4"/>
  <text class="mono" x="599" y="411" font-size="12.5" fill="#B26A05" text-anchor="middle">? listener</text>
  <line x1="649" y1="406" x2="771" y2="406" stroke="#4B5A75" stroke-width="2" stroke-dasharray="6 6" opacity="0.75"/>
  <!-- node: ? async event -->
  <rect x="771" y="391" width="122" height="30" rx="6" fill="#F6EDE1" stroke="#B26A05" stroke-dasharray="5 4"/>
  <text class="mono" x="832" y="411" font-size="12.5" fill="#B26A05" text-anchor="middle">? async event</text>
  <line x1="893" y1="406" x2="1015" y2="406" stroke="#4B5A75" stroke-width="2" stroke-dasharray="6 6" opacity="0.75"/>
  <!-- node: database -->
  <rect x="1015" y="391" width="84" height="30" rx="6" fill="#EDF1F7" stroke="#C9D3E2"/>
  <text class="mono" x="1057" y="411" font-size="12.5" fill="#16223A" text-anchor="middle">database</text>

  <text class="body" x="60" y="474" font-size="13.5" fill="#4B5A75">Every <tspan fill="#B26A05" font-weight="700">?</tspan> is an hour of manual digging — or a wrong guess.</text>

  <!-- ================= THE SYSTEM ================= -->
  <text class="mono" x="60" y="520" font-size="12" letter-spacing="2.5" fill="#4B5A75">THE SYSTEM — FOUR STEPS</text>
  <line x1="300" y1="516" x2="1140" y2="516" stroke="#C9D3E2" stroke-width="1"/>

  <!-- stage 1 -->
  <rect x="60" y="544" width="240" height="128" rx="8" fill="#FFFFFF" stroke="#C9D3E2"/>
  <text class="mono" x="80" y="572" font-size="11" letter-spacing="1.5" fill="#1E44B8">STEP 1</text>
  <text class="display" x="80" y="596" font-size="16.5" font-weight="600" fill="#16223A">Hard task lands</text>
  <text class="body" x="80" y="620" font-size="12.5" fill="#4B5A75">An undocumented flow</text>
  <text class="body" x="80" y="638" font-size="12.5" fill="#4B5A75">needs tracing, fast.</text>
  <text class="mono" x="320" y="616" font-size="20" fill="#1E44B8" text-anchor="middle">»</text>
  <!-- stage 2 -->
  <rect x="340" y="544" width="240" height="128" rx="8" fill="#FFFFFF" stroke="#C9D3E2"/>
  <text class="mono" x="360" y="572" font-size="11" letter-spacing="1.5" fill="#1E44B8">STEP 2</text>
  <text class="display" x="360" y="596" font-size="16.5" font-weight="600" fill="#16223A">AI drafts the trace</text>
  <text class="body" x="360" y="620" font-size="12.5" fill="#4B5A75">An agent reads the code and</text>
  <text class="body" x="360" y="638" font-size="12.5" fill="#4B5A75">proposes the step-by-step flow.</text>
  <text class="mono" x="600" y="616" font-size="20" fill="#1E44B8" text-anchor="middle">»</text>
  <!-- stage 3 -->
  <rect x="620" y="544" width="240" height="128" rx="8" fill="#FFFFFF" stroke="#C9D3E2"/>
  <text class="mono" x="640" y="572" font-size="11" letter-spacing="1.5" fill="#1E44B8">STEP 3</text>
  <text class="display" x="640" y="596" font-size="16.5" font-weight="600" fill="#16223A">Guardrails filter it</text>
  <text class="body" x="640" y="620" font-size="12.5" fill="#4B5A75">Prompts, skills, and docs strip</text>
  <text class="body" x="640" y="638" font-size="12.5" fill="#4B5A75">out anything the AI can't prove.</text>
  <text class="mono" x="880" y="616" font-size="20" fill="#1E44B8" text-anchor="middle">»</text>
  <!-- stage 4 -->
  <rect x="900" y="544" width="240" height="128" rx="8" fill="#ECF0FD" stroke="#2B5CE6"/>
  <text class="mono" x="920" y="572" font-size="11" letter-spacing="1.5" fill="#1E44B8">STEP 4</text>
  <text class="display" x="920" y="596" font-size="16.5" font-weight="600" fill="#16223A">Verified answer</text>
  <text class="body" x="920" y="620" font-size="12.5" fill="#4B5A75">Every step cited and checked —</text>
  <text class="body" x="920" y="638" font-size="12.5" fill="#4B5A75">or clearly flagged as a guess.</text>

  <!-- ================= THE THREE GUARDRAILS ================= -->
  <text class="mono" x="60" y="716" font-size="12" letter-spacing="2.5" fill="#4B5A75">THE THREE GUARDRAILS</text>
  <line x1="270" y1="712" x2="1140" y2="712" stroke="#C9D3E2" stroke-width="1"/>

  <!-- card 1: prompt engineering -->
  <rect x="60" y="740" width="340" height="300" rx="8" fill="#FFFFFF" stroke="#C9D3E2"/>
  <rect x="84" y="764" width="40" height="40" rx="6" fill="#ECF0FD"/>
  <text class="mono" x="104" y="790" font-size="15" font-weight="700" fill="#1E44B8" text-anchor="middle">{ }</text>
  <text class="display" x="84" y="838" font-size="18" font-weight="600" fill="#16223A">Prompt engineering</text>
  <text class="mono" x="84" y="860" font-size="10.5" letter-spacing="1.5" fill="#1E44B8">CONSTRAINS THE DRAFT</text>
  <text class="body" x="84" y="890" font-size="12.8" fill="#1E44B8">▸</text>
  <text class="body" x="100" y="890" font-size="12.8" fill="#4B5A75">Every step must cite real code —</text>
  <text class="mono" x="100" y="908" font-size="12" fill="#4B5A75">Class.method + file:line</text>
  <text class="body" x="84" y="932" font-size="12.8" fill="#1E44B8">▸</text>
  <text class="body" x="100" y="932" font-size="12.8" fill="#4B5A75">Structured, numbered output —</text>
  <text class="body" x="100" y="950" font-size="12.8" fill="#4B5A75">vague prose is rejected</text>
  <text class="body" x="84" y="974" font-size="12.8" fill="#1E44B8">▸</text>
  <text class="body" x="100" y="974" font-size="12.8" fill="#4B5A75">One prepared, single-shot prompt —</text>
  <text class="body" x="100" y="992" font-size="12.8" fill="#4B5A75">no blind retry loops</text>
  <line x1="84" y1="1006" x2="376" y2="1006" stroke="#C9D3E2"/>
  <text class="body" x="84" y="1026" font-size="12.5" font-weight="600" fill="#16223A">The AI can't hide a guess inside a nice story.</text>

  <!-- card 2: skills -->
  <rect x="430" y="740" width="340" height="300" rx="8" fill="#FFFFFF" stroke="#C9D3E2"/>
  <rect x="454" y="764" width="40" height="40" rx="6" fill="#ECF0FD"/>
  <text class="mono" x="474" y="790" font-size="15" font-weight="700" fill="#1E44B8" text-anchor="middle">::</text>
  <text class="display" x="454" y="838" font-size="18" font-weight="600" fill="#16223A">Skills — codified workflows</text>
  <text class="mono" x="454" y="860" font-size="10.5" letter-spacing="1.5" fill="#1E44B8">CONSTRAINS THE PROCESS</text>
  <text class="body" x="454" y="890" font-size="12.8" fill="#1E44B8">▸</text>
  <text class="body" x="470" y="890" font-size="12.8" fill="#4B5A75">Reusable protocols (a flow-tracer skill)</text>
  <text class="body" x="470" y="908" font-size="12.8" fill="#4B5A75">the AI must follow every run</text>
  <text class="body" x="454" y="932" font-size="12.8" fill="#1E44B8">▸</text>
  <text class="body" x="470" y="932" font-size="12.8" fill="#4B5A75">Each step tagged VERIFIED or</text>
  <text class="body" x="470" y="950" font-size="12.8" fill="#4B5A75">INFERRED — no untagged claims</text>
  <text class="body" x="454" y="974" font-size="12.8" fill="#1E44B8">▸</text>
  <text class="body" x="470" y="974" font-size="12.8" fill="#4B5A75">The workflow itself is the guardrail,</text>
  <text class="body" x="470" y="992" font-size="12.8" fill="#4B5A75">not my memory</text>
  <line x1="454" y1="1006" x2="746" y2="1006" stroke="#C9D3E2"/>
  <text class="body" x="454" y="1026" font-size="12.5" font-weight="600" fill="#16223A">Same rigor every time — not just when I remember.</text>

  <!-- card 3: documentation -->
  <rect x="800" y="740" width="340" height="300" rx="8" fill="#FFFFFF" stroke="#C9D3E2"/>
  <rect x="824" y="764" width="40" height="40" rx="6" fill="#ECF0FD"/>
  <text class="mono" x="844" y="790" font-size="15" font-weight="700" fill="#1E44B8" text-anchor="middle">≡</text>
  <text class="display" x="824" y="838" font-size="18" font-weight="600" fill="#16223A">Documentation</text>
  <text class="mono" x="824" y="860" font-size="10.5" letter-spacing="1.5" fill="#1E44B8">GROUNDS FUTURE ANSWERS</text>
  <text class="body" x="824" y="890" font-size="12.8" fill="#1E44B8">▸</text>
  <text class="body" x="840" y="890" font-size="12.8" fill="#4B5A75">Every verified trace becomes a</text>
  <text class="body" x="840" y="908" font-size="12.8" fill="#4B5A75">permanent note</text>
  <text class="body" x="824" y="932" font-size="12.8" fill="#1E44B8">▸</text>
  <text class="body" x="840" y="932" font-size="12.8" fill="#4B5A75">Notes build into a context pack</text>
  <text class="body" x="840" y="950" font-size="12.8" fill="#4B5A75">about our system</text>
  <text class="body" x="824" y="974" font-size="12.8" fill="#1E44B8">▸</text>
  <text class="body" x="840" y="974" font-size="12.8" fill="#4B5A75">AI answers from my checked facts —</text>
  <text class="body" x="840" y="992" font-size="12.8" fill="#4B5A75">not its imagination</text>
  <line x1="824" y1="1006" x2="1116" y2="1006" stroke="#C9D3E2"/>
  <text class="body" x="824" y="1026" font-size="12.5" font-weight="600" fill="#16223A">Hallucination risk shrinks with every task.</text>

  <!-- ================= HOW EVERY CLAIM GETS CHECKED ================= -->
  <text class="mono" x="60" y="1088" font-size="12" letter-spacing="2.5" fill="#4B5A75">HOW EVERY CLAIM GETS CHECKED</text>
  <line x1="348" y1="1084" x2="1140" y2="1084" stroke="#C9D3E2" stroke-width="1"/>

  <rect x="60" y="1112" width="528" height="108" rx="8" fill="#E9F3EF" stroke="#1E8A5A"/>
  <text class="mono" x="84" y="1142" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#1E8A5A">✔ VERIFIED</text>
  <text class="body" x="84" y="1168" font-size="13" fill="#4B5A75">I opened the cited code myself and confirmed the step is real.</text>
  <text class="body" x="84" y="1188" font-size="13" fill="#4B5A75">~30 seconds per step — and the answer becomes mine.</text>

  <rect x="612" y="1112" width="528" height="108" rx="8" fill="#F6EDE1" stroke="#B26A05"/>
  <text class="mono" x="636" y="1142" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#B26A05">△ INFERRED</text>
  <text class="body" x="636" y="1168" font-size="13" fill="#4B5A75">The AI guessed. Clearly flagged, never acted on until checked.</text>
  <text class="body" x="636" y="1188" font-size="13" fill="#4B5A75">A labeled guess is useful; a hidden guess is a hallucination.</text>

  <rect x="60" y="1240" width="1080" height="56" rx="8" fill="#FFFFFF" stroke="#C9D3E2"/>
  <text class="body" x="84" y="1274" font-size="13.5" fill="#16223A"><tspan font-weight="700">Plus one runtime spot-check per trace:</tspan><tspan fill="#4B5A75">&#160;a breakpoint or log line on the least-trusted step — where static AI reading is wrong most often.</tspan></text>

  <!-- ================= THESIS ================= -->
  <rect x="60" y="1328" width="1080" height="112" rx="10" fill="#16223A"/>
  <text class="display" x="96" y="1378" font-size="28" font-weight="700" fill="#EDF1F7">AI drafts. <tspan fill="#8FADFF">Skills constrain.</tspan> Documentation grounds.</text>
  <text class="body" x="96" y="1408" font-size="14.5" fill="#EDF1F7" opacity="0.72">Every answer is either cited and verified — or clearly flagged as a guess. That's how a frustrating task becomes a fast one.</text>

  <!-- footer -->
  <text class="mono" x="600" y="1488" font-size="11" letter-spacing="1.5" fill="#4B5A75" text-anchor="middle">MUSE · AGENTIC AI WORKFLOW — PROMPT ENGINEERING × SKILLS × DOCUMENTATION</text>
</svg>
